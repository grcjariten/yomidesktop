<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:"><title>YomiDesktop</title><link rel="stylesheet" href="style.css"><script defer src="i18n.js"></script><script defer src="home.js"></script></head><body>
<div id="loading" role="status" aria-live="polite"><img src="../extension/images/icon64.png" width="56" height="56" alt=""><div class="spinner"></div><p id="loading-text"></p><progress id="progress" hidden></progress></div>
<header><img src="../extension/images/icon64.png" width="36" height="36" alt=""><h1>YomiDesktop</h1><label class="switch" data-i18n-title="switch.title"><span id="toggle-label" data-i18n="on"></span><input type="checkbox" id="toggle" role="switch" checked><i></i></label></header>
<main>
<section class="hero"><h2><span data-i18n="hero"></span> <button id="key-label" class="key" data-i18n-title="key.title">Shift</button></h2>
<div id="key-menu" hidden><span data-i18n="key.menu"></span><button data-key="shift" class="secondary">Shift</button><button data-key="ctrl" class="secondary">Ctrl</button><button data-key="alt" class="secondary">Alt</button><button id="custom-key" class="secondary" data-i18n="key.other"></button></div>
<p id="key-capture" class="small" hidden data-i18n-html="key.capture"></p>
<div id="status" role="status" aria-live="polite"></div></section>
<button id="settings" class="options" data-i18n="options"></button>
<section><div class="section-title"><h3 data-i18n="ocr.title"></h3><label class="switch"><input type="checkbox" id="ocr-toggle" role="switch" checked><i></i></label></div><p id="ocr-state" class="small" role="status"></p></section>
<section><div class="section-title"><h3><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5A2.5 2.5 0 0 1 7.5 2H19v16H7.5A2.5 2.5 0 0 0 5 20.5z" fill="#e8a54b"/><path d="M5 20.5A2.5 2.5 0 0 1 7.5 18H19v4H7.5A2.5 2.5 0 0 1 5 20.5z" fill="#f6e7cf"/><path d="M9 6h7M9 9h5" stroke="#7a4a12" stroke-width="1.6" stroke-linecap="round"/></svg><span data-i18n="dict.title"></span></h3><span id="dictionary-count">—</span></div><p id="dict-description" class="small"></p><details><summary data-i18n="dict.show"></summary><ul id="dictionaries"></ul></details></section>
<section><div class="section-title"><h3><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="2" width="15" height="19" rx="2.5" transform="rotate(12 12.5 11.5)" fill="#5b8fd6"/><rect x="3.5" y="3" width="15" height="19" rx="2.5" fill="#eef3fb"/><path d="M11 7.2l1.3 2.7 3 .4-2.2 2 .6 3-2.7-1.5-2.7 1.5.6-3-2.2-2 3-.4z" fill="#4a86d9"/></svg>Anki</h3><span id="anki-state"></span></div><p class="small" data-i18n="anki.about"></p><details id="anki-details"><summary data-i18n="anki.configure"></summary><div class="form"><label><span data-i18n="anki.server"></span><input id="anki-server" value="http://127.0.0.1:8765" autocomplete="off"></label><label><span data-i18n="anki.deck"></span><input id="anki-deck" value="Yomitan" autocomplete="off"></label><label><span data-i18n="anki.key"></span><input id="anki-key" type="password" autocomplete="off"></label><div class="actions"><button id="anki-test" class="secondary" data-i18n="anki.test"></button><button id="anki-prepare" data-i18n="anki.prepare"></button></div><p id="anki-result" role="status"></p></div></details></section>
<footer><label class="check"><input type="checkbox" id="autostart"> <span data-i18n="autostart"></span></label><label class="check">🌐 <span data-i18n="language"></span><select id="language"></select></label><button id="wizard" class="secondary" data-i18n="wizard"></button></footer>
<p class="note" id="note-close"></p>
<p class="note" data-i18n="note.ocr"></p>
<button id="perapera" class="promo" data-i18n-title="promo.title"><img src="perapera.png" width="28" height="28" alt=""><span data-i18n="promo"></span></button>
</main></body></html>
