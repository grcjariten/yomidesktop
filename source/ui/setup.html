<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:"><title>YomiDesktop</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="setup.css"><script defer src="i18n.js"></script><script defer src="setup.js"></script></head><body>
<header><img src="../extension/images/icon64.png" width="44" height="44" alt=""><div><h1>YomiDesktop</h1><p data-i18n="setup.sub"></p></div><ol class="steps"><li data-i18n="setup.s1"></li><li data-i18n="setup.s2"></li><li data-i18n="setup.s3"></li><li data-i18n="setup.s4"></li></ol><label class="language">🌐 <select id="language" aria-label="Language"></select></label></header>
<main>

<section class="step" data-step="0">
  <p class="eyebrow" data-i18n="setup.welcome"></p>
  <h2 data-i18n="setup.welcomeH"></h2>
  <p data-i18n="setup.welcomeP1"></p>
  <p data-i18n-html="setup.welcomeP2"></p>
</section>

<section class="step" data-step="1" hidden>
  <p class="eyebrow" data-i18n="setup.keyE"></p>
  <h2 data-i18n="setup.keyH"></h2>
  <p data-i18n="setup.keyP"></p>
  <div class="choices" role="radiogroup">
    <label class="choice"><input type="radio" name="key" value="shift"><kbd>Shift</kbd><span data-i18n="setup.recommended"></span></label>
    <label class="choice"><input type="radio" name="key" value="ctrl"><kbd>Ctrl</kbd><span>&nbsp;</span></label>
    <label class="choice"><input type="radio" name="key" value="alt"><kbd>Alt</kbd><span data-i18n="setup.altNote"></span></label>
  </div>
</section>

<section class="step" data-step="2" hidden>
  <p class="eyebrow" data-i18n="setup.dictE"></p>
  <h2 data-i18n="setup.dictH"></h2>
  <p data-i18n="setup.dictP"></p>
  <ul id="dict-list" class="dict-list"></ul>
  <p id="dict-total" class="hint"></p>
  <div id="dict-progress" class="progress-box" hidden><progress id="dict-bar"></progress><p id="dict-status" role="status"></p></div>
</section>

<section class="step" data-step="3" hidden>
  <p class="eyebrow" data-i18n="setup.ankiE"></p>
  <h2 data-i18n="setup.ankiH"></h2>
  <p data-i18n="setup.ankiP"></p>
  <ol class="guide">
    <li><span data-i18n-html="setup.anki1"></span> <button class="link" data-link="anki" data-i18n="setup.ankiDownload"></button></li>
    <li><span data-i18n-html="setup.anki2"></span> <code>2055492159</code> <button class="link" id="copy-code" data-i18n="setup.copy"></button><br><span data-i18n="setup.anki2b"></span></li>
    <li><span data-i18n-html="setup.anki3"></span> <button id="anki-check" class="secondary" data-i18n="setup.check"></button> <span id="anki-check-result" role="status"></span></li>
  </ol>
  <div class="form">
    <label><span data-i18n="setup.deck"></span><input id="anki-deck" value="Yomitan" autocomplete="off"></label>
    <label class="check"><input type="checkbox" id="anki-meaning"> <span data-i18n="setup.meaning"></span></label>
  </div>
  <p id="anki-result" class="hint" role="status"></p>
</section>

<section class="step" data-step="4" hidden>
  <p class="eyebrow" data-i18n="setup.doneE"></p>
  <h2 data-i18n="setup.doneH"></h2>
  <p data-i18n-html="setup.doneP1"></p>
  <p data-i18n-html="setup.doneP2"></p>
  <label class="check big"><input type="checkbox" id="autostart" checked> <span data-i18n="setup.autostart"></span></label>
  <p class="hint" data-i18n="setup.redo"></p>
</section>

<nav class="wizard-nav"><button id="back" class="secondary" data-i18n="setup.back"></button><span id="nav-note"></span><button id="skip" class="secondary" hidden data-i18n="setup.skip"></button><button id="next"></button></nav>
</main></body></html>
